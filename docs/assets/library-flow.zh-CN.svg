    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#111728"/><stop offset="1" stop-color="#19172B"/></linearGradient>
    <linearGradient id="art" x2="1" y2="1"><stop stop-color="#8574F4"/><stop offset="1" stop-color="#4D7BC3"/></linearGradient>
  </defs>
  <rect width="1280" height="456" rx="24" fill="url(#background)"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
