name: Windows integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-fixtures:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare tools and run native tests
        run: python prepare.py
      - name: Test core organization
        run: python test_e2e.py --root test-output/e2e
      - name: Test advanced settings
        run: python test_advanced.py --root test-output/advanced
      - name: Test platform formats and key import
        run: python test_platforms.py --root test-output/platforms
      - name: Test Apple exports and separate archives
        run: python test_apple.py --root test-output/apple
      - name: Test English catalog and metadata isolation
        run: python test_i18n.py
      - name: Test Apple disc conversion and archival
        run: python test_apple_discs.py --root test-output/apple-discs
      - name: Test tool cache and replacement
        run: python test_runtime.py --root test-output/runtime
      - name: Test GUI controls in English
        run: python main.py --check-gui --language en --report test-output/Gui-English.json
      - name: Test GUI controls in Chinese
        run: python main.py --check-gui --language zh_CN --report test-output/Gui-Chinese.json
