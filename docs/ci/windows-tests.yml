name: Windows integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-fixtures:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare tools and run native tests
        run: python prepare.py
      - name: Test core organization
        run: python test_e2e.py --root test-output/e2e
      - name: Test advanced settings
        run: python test_advanced.py --root test-output/advanced
      - name: Test platform formats and key import
        run: python test_platforms.py --root test-output/platforms
